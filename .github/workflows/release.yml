name: Release

# Builds the distributable plugin zip and attaches it to the GitHub release.
#
# The zip is produced by bin/build-zip.sh, the same script used locally. The
# exclusion rules live in .distignore and are read only by that script, so CI
# and a developer's machine cannot drift apart.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the plugin zip
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Verify the tag, the Version header and the Stable tag agree
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9.]+' repagio.php)
          README=$(grep -m1 -oP '^Stable tag:\s*\K[0-9.]+' readme.txt)

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG / header: $HEADER / readme stable tag: $README"

          # A mismatch ships a plugin that reports the wrong version and would
          # offer itself an update it has already installed.
          if [ "$TAG" != "$HEADER" ]; then
            echo "::error::Tag v$TAG does not match the Version header ($HEADER) in repagio.php"
            exit 1
          fi

          if [ "$TAG" != "$README" ]; then
            echo "::error::Tag v$TAG does not match the Stable tag ($README) in readme.txt"
            exit 1
          fi

      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build the zip
        # The single source of truth. The script reads .distignore, stages under
        # the plugin slug, and refuses to produce an archive that is missing a
        # required file or carrying an excluded one.
        run: bash bin/build-zip.sh

      - name: Confirm the archive is what we expect
        run: |
          echo "Archive contents:"
          unzip -l repagio.zip

          # Exactly one top-level folder, named for the install directory.
          TOP=$(unzip -Z1 repagio.zip | cut -d/ -f1 | sort -u)
          if [ "$TOP" != "repagio" ]; then
            echo "::error::Expected a single top-level folder 'repagio', found: $TOP"
            exit 1
          fi

          # Plugin Check reports every dotfile as hidden_files.
          if unzip -Z1 repagio.zip | grep -E '(^|/)\.'; then
            echo "::error::A dotfile reached the archive"
            exit 1
          fi

      - name: Name the archive for the release
        run: mv repagio.zip "repagio-${{ steps.version.outputs.tag }}.zip"

      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: repagio-${{ steps.version.outputs.tag }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
